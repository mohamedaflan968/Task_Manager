<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixTask - Mobile Shop Task Manager</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="landing-page">
    <!-- Floating animated icons -->
    <div class="floating-icons">
      <div class="float-icon fi-1"><i class="bi bi-phone-fill"></i></div>
      <div class="float-icon fi-2"><i class="bi bi-tools"></i></div>
      <div class="float-icon fi-3"><i class="bi bi-list-task"></i></div>
      <div class="float-icon fi-4"><i class="bi bi-whatsapp"></i></div>
      <div class="float-icon fi-5"><i class="bi bi-people-fill"></i></div>
      <div class="float-icon fi-6"><i class="bi bi-gear-fill"></i></div>
      <div class="float-icon fi-7"><i class="bi bi-check-circle-fill"></i></div>
      <div class="float-icon fi-8"><i class="bi bi-cpu-fill"></i></div>
      <div class="float-icon fi-9"><i class="bi bi-battery-charging"></i></div>
      <div class="float-icon fi-10"><i class="bi bi-wifi"></i></div>
      <div class="float-icon fi-11"><i class="bi bi-usb-symbol"></i></div>
      <div class="float-icon fi-12"><i class="bi bi-shield-check"></i></div>
    </div>

    <div class="landing-card">
      <div class="landing-logo-wrapper">
        <img src="assets/icons/logo.svg" alt="FixTask Logo" class="landing-logo-img">
      </div>
      <h1 class="landing-title">Fix<span class="text-primary">Task</span></h1>
      <p class="subtitle">Mobile Shop Task Manager</p>
      <div class="landing-divider"></div>
      <p class="desc">
        A simple, powerful task manager designed for mobile phone repair shops.
        Track repairs, manage customers, and send notifications &mdash; all from your browser.
      </p>
      <a href="dashboard.html" class="btn-landing">
        <i class="bi bi-arrow-right-circle"></i> Open Dashboard
      </a>
      <div class="landing-footer">
        <p>Developed By Mohamed Aflan | Contact - 0760562969</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

    // Disable right click
document.addEventListener("contextmenu", function(e){
    e.preventDefault();
});

// Disable developer shortcuts
document.addEventListener("keydown", function(e){

    // F12
    if(e.key === "F12"){
        e.preventDefault();
    }

    // Ctrl + Shift + I (Inspect)
    if(e.ctrlKey && e.shiftKey && e.key === "I"){
        e.preventDefault();
    }

    // Ctrl + Shift + J (Console)
    if(e.ctrlKey && e.shiftKey && e.key === "J"){
        e.preventDefault();
    }

    // Ctrl + U (View Source)
    if(e.ctrlKey && e.key === "u"){
        e.preventDefault();
    }

});
  </script>
</body>
</html>
