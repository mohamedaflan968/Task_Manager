<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1d4ed8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- Wrench -->
  <g transform="translate(60,58) rotate(-45)" filter="url(#shadow)">
    <rect x="-3" y="-30" width="6" height="38" rx="3" fill="#fff"/>
    <circle cx="0" cy="-30" r="10" fill="none" stroke="#fff" stroke-width="5"/>
    <circle cx="0" cy="-30" r="5" fill="url(#bg)"/>
  </g>
  <!-- Phone -->
  <g transform="translate(38,32)" filter="url(#shadow)">
    <rect x="0" y="0" width="22" height="38" rx="4" fill="#fff" opacity="0.95"/>
    <rect x="2" y="3" width="18" height="28" rx="2" fill="#2563eb"/>
    <circle cx="11" cy="35" r="1.5" fill="#2563eb"/>
    <rect x="8" y="1" width="6" height="1.5" rx="0.75" fill="#2563eb" opacity="0.5"/>
  </g>
  <!-- Checkmark -->
  <g transform="translate(72,78)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="12" fill="#fff" opacity="0.95"/>
    <polyline points="-6,0 -2,5 7,-5" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
