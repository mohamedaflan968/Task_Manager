<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks - FixTask</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <header class="app-topbar" id="app-topbar"></header>
    <main class="app-main">

      <!-- LIST VIEW -->
      <div id="tasksListView">
        <div class="section-header">
          <h4 class="mb-0">Tasks <small class="text-muted fs-6" id="taskCount"></small></h4>
          <a href="tasks.html?action=new" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>New Task</a>
        </div>
        <ul class="nav nav-pills task-tabs mb-3" id="statusTabs">
          <li class="nav-item"><a class="nav-link active" href="#" data-filter="All">All <span class="tab-count" id="countAll">0</span></a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-filter="Pending">Pending <span class="tab-count" id="countPending">0</span></a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-filter="In Progress">In Progress <span class="tab-count" id="countInProgress">0</span></a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-filter="Completed">Completed <span class="tab-count" id="countCompleted">0</span></a></li>
        </ul>
        <div class="d-flex gap-2 mb-3 flex-wrap">
          <input type="text" class="form-control form-control-sm" placeholder="Search by name, ID, device..." id="taskSearch" style="max-width:300px;">
          <select class="form-select form-select-sm" id="statusFilter" style="width:auto;display:none;">
            <option value="All">All</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>
          <input type="date" class="form-control form-control-sm" id="dateFilter" style="width:auto;">
        </div>
        <div id="taskListContainer"></div>
      </div>

      <!-- FORM VIEW -->
      <div id="tasksFormView" style="display:none;">
        <div class="section-header">
          <h4 class="mb-0" id="formTitle">New Repair Task</h4>
        </div>
        <div class="card" style="border-radius:var(--radius);border:1px solid #e2e8f0;">
          <div class="card-body">
            <div class="mb-3"><span class="text-muted">Task ID: </span><strong id="taskIdDisplay"></strong></div>
            <form id="taskForm"></form>
          </div>
        </div>
      </div>

      <!-- DETAIL VIEW -->
      <div id="tasksDetailView" style="display:none;">
        <div class="card" style="border-radius:var(--radius);border:1px solid #e2e8f0;">
          <div class="card-body" id="taskDetailContainer"></div>
        </div>
      </div>

      <div class="app-footer">Developed By Mohamed Aflan | Contact - 0760562969</div>
    </main>
  </div>

  <div class="mobile-bottom-nav" id="mobile-nav"></div>
  <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999;"></div>

  <!-- Confirm Modal -->
  <div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius:var(--radius);">
        <div class="modal-header"><h5 class="modal-title">Confirm</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="confirmModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmModalYes">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Notification Modal -->
  <div class="modal fade" id="notificationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius:var(--radius);">
        <div class="modal-header"><h5 class="modal-title"><i class="bi bi-bell me-2"></i>Notify Customer</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <label class="form-label">Message</label>
          <textarea class="form-control" id="notifMessage" rows="6" readonly></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" id="notifSkip" data-bs-dismiss="modal">Skip</button>
          <button type="button" class="btn btn-outline-success" id="notifSMS"><i class="bi bi-chat-dots me-1"></i>SMS</button>
          <button type="button" class="btn btn-success" id="notifWhatsApp"><i class="bi bi-whatsapp me-1"></i>WhatsApp</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tasks.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      Tasks.init();
      document.getElementById('taskSearch').addEventListener('input', function(){ Tasks.renderList(); });
      document.getElementById('dateFilter').addEventListener('change', function(){ Tasks.renderList(); });
      document.querySelectorAll('#statusTabs .nav-link').forEach(function(tab){
        tab.addEventListener('click', function(e){
          e.preventDefault();
          document.querySelectorAll('#statusTabs .nav-link').forEach(function(t){ t.classList.remove('active'); });
          this.classList.add('active');
          var filter = this.getAttribute('data-filter');
          document.getElementById('statusFilter').value = filter;
          Tasks.renderList();
        });
      });
      window.addEventListener('resize', function(){ Tasks.renderList(); });
    });

    // Disable right click
document.addEventListener("contextmenu", function(e){
    e.preventDefault();
});

// Disable developer shortcuts
document.addEventListener("keydown", function(e){

    // F12
    if(e.key === "F12"){
        e.preventDefault();
    }

    // Ctrl + Shift + I (Inspect)
    if(e.ctrlKey && e.shiftKey && e.key === "I"){
        e.preventDefault();
    }

    // Ctrl + Shift + J (Console)
    if(e.ctrlKey && e.shiftKey && e.key === "J"){
        e.preventDefault();
    }

    // Ctrl + U (View Source)
    if(e.ctrlKey && e.key === "u"){
        e.preventDefault();
    }

});
  </script>
</body>
</html>
