<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services - FixTask</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <header class="app-topbar" id="app-topbar"></header>
    <main class="app-main">
      <div class="section-header">
        <h4 class="mb-0">Services</h4>
        <button class="btn btn-primary" onclick="Services.showAddModal()"><i class="bi bi-plus-lg me-1"></i>Add Service</button>
      </div>
      <div id="servicesListContainer"></div>
      <div class="app-footer">Developed By Mohamed Aflan | Contact - 0760562969</div>
    </main>
  </div>

  <div class="mobile-bottom-nav" id="mobile-nav"></div>
  <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999;"></div>

  <div class="modal fade" id="serviceModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius:var(--radius);">
        <div class="modal-header">
          <h5 class="modal-title" id="serviceModalLabel">Add Service</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="serviceEditId">
          <div class="mb-3">
            <label class="form-label">Service Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="serviceName" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Default Price (Rs.) <span class="text-danger">*</span></label>
            <input type="number" class="form-control" id="servicePrice" min="0" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="Services.saveService()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius:var(--radius);">
        <div class="modal-header"><h5 class="modal-title">Confirm</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="confirmModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmModalYes">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/services.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      Services.init();
      window.addEventListener('resize', function(){ Services.render(); });
    });

    // Disable right click
document.addEventListener("contextmenu", function(e){
    e.preventDefault();
});

// Disable developer shortcuts
document.addEventListener("keydown", function(e){

    // F12
    if(e.key === "F12"){
        e.preventDefault();
    }

    // Ctrl + Shift + I (Inspect)
    if(e.ctrlKey && e.shiftKey && e.key === "I"){
        e.preventDefault();
    }

    // Ctrl + Shift + J (Console)
    if(e.ctrlKey && e.shiftKey && e.key === "J"){
        e.preventDefault();
    }

    // Ctrl + U (View Source)
    if(e.ctrlKey && e.key === "u"){
        e.preventDefault();
    }

});
  </script>
</body>
</html>
