<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers - FixTask</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <header class="app-topbar" id="app-topbar"></header>
    <main class="app-main">
      <div class="section-header">
        <h4 class="mb-0">Customers</h4>
      </div>
      <div class="mb-3">
        <input type="text" class="form-control form-control-sm" placeholder="Search by name or phone..." id="custSearch" style="max-width:400px;">
      </div>
      <div id="customerListContainer"></div>
      <div class="app-footer">Developed By Mohamed Aflan | Contact - 0760562969</div>
    </main>
  </div>

  <div class="mobile-bottom-nav" id="mobile-nav"></div>
  <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999;"></div>

  <div class="modal fade" id="customerDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content" style="border-radius:var(--radius);">
        <div class="modal-header">
          <div>
            <h5 class="modal-title" id="custDetailName"></h5>
            <small class="text-muted" id="custDetailPhone"></small>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="custTaskList"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/customers.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      Customers.init();
      document.getElementById('custSearch').addEventListener('input', function(){ Customers.render(); });
      window.addEventListener('resize', function(){ Customers.render(); });
    });

    // Disable right click
document.addEventListener("contextmenu", function(e){
    e.preventDefault();
});

// Disable developer shortcuts
document.addEventListener("keydown", function(e){

    // F12
    if(e.key === "F12"){
        e.preventDefault();
    }

    // Ctrl + Shift + I (Inspect)
    if(e.ctrlKey && e.shiftKey && e.key === "I"){
        e.preventDefault();
    }

    // Ctrl + Shift + J (Console)
    if(e.ctrlKey && e.shiftKey && e.key === "J"){
        e.preventDefault();
    }

    // Ctrl + U (View Source)
    if(e.ctrlKey && e.key === "u"){
        e.preventDefault();
    }

});
  </script>
</body>
</html>
