<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Details - FixTask</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <header class="app-topbar" id="app-topbar"></header>
    <main class="app-main">
      <div class="card" style="border-radius:var(--radius);border:1px solid #e2e8f0;">
        <div class="card-body" id="taskDetailContainer"></div>
      </div>
      <div class="app-footer">Developed By Mohamed Aflan | Contact - 0760562969</div>
    </main>
  </div>
  <div class="mobile-bottom-nav" id="mobile-nav"></div>
  <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999;"></div>

  <div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius:var(--radius);">
        <div class="modal-header"><h5 class="modal-title">Confirm</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="confirmModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmModalYes">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="notificationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius:var(--radius);">
        <div class="modal-header"><h5 class="modal-title"><i class="bi bi-bell me-2"></i>Notify Customer</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <label class="form-label">Message</label>
          <textarea class="form-control" id="notifMessage" rows="6" readonly></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" id="notifSkip" data-bs-dismiss="modal">Skip</button>
          <button type="button" class="btn btn-outline-info" id="notifBill"><i class="bi bi-receipt me-1"></i>Print Bill</button>
          <button type="button" class="btn btn-outline-success" id="notifSMS"><i class="bi bi-chat-dots me-1"></i>SMS</button>
          <button type="button" class="btn btn-success" id="notifWhatsApp"><i class="bi bi-whatsapp me-1"></i>WhatsApp</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/thermal.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tasks.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      if (id) {
        Tasks.renderDetails(id);
      } else {
        document.getElementById('taskDetailContainer').innerHTML = '<div class="empty-state"><i class="bi bi-exclamation-circle"></i><h5>No task specified</h5><a href="tasks.html" class="btn btn-primary">Back to Tasks</a></div>';
      }
    });

    // Disable right click
document.addEventListener("contextmenu", function(e){
    e.preventDefault();
});

// Disable developer shortcuts
document.addEventListener("keydown", function(e){

    // F12
    if(e.key === "F12"){
        e.preventDefault();
    }

    // Ctrl + Shift + I (Inspect)
    if(e.ctrlKey && e.shiftKey && e.key === "I"){
        e.preventDefault();
    }

    // Ctrl + Shift + J (Console)
    if(e.ctrlKey && e.shiftKey && e.key === "J"){
        e.preventDefault();
    }

    // Ctrl + U (View Source)
    if(e.ctrlKey && e.key === "u"){
        e.preventDefault();
    }

});
  </script>
</body>
</html>
